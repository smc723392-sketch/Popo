  - name: Configure Core RDP Settings
    run: |
      # เปิดใช้งาน Remote Desktop และปิด Network Level Authentication (NLA)
      Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
      Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
      Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

      # ตั้งค่า Windows Firewall ให้ยอมรับพอร์ต 3389
      netsh advfirewall firewall delete rule name="RDP-Tailscale"
      netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

      # รีสตาร์ทเซอร์วิส RDP
      Restart-Service -Name TermService -Force

  - name: Create RDP User with Secure Password
    run: |
      $charSet = @{
          Upper   = [char[]](65..90)
          Lower   = [char[]](97..122)
          Number  = [char[]](48..57)
          Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
      }
      $rawPassword = @()
      $rawPassword += $charSet.Upper | Get-Random -Count 4
      $rawPassword += $charSet.Lower | Get-Random -Count 4
      $rawPassword += $charSet.Number | Get-Random -Count 4
      $rawPassword += $charSet.Special | Get-Random -Count 4
      $password = -join ($rawPassword | Sort-Object { Get-Random })

      # [จุดพัฒนา] ทำการ Mask รหัสผ่านใน GitHub Logs ไม่ให้คนอื่นแอบเห็น
      echo "::add-mask::$password"

      $securePass = ConvertTo-SecureString $password -AsPlainText -Force
      New-LocalUser -Name "Skyro" -Password $securePass -AccountNeverExpires
      Add-LocalGroupMember -Group "Administrators" -Member "Skyro"
      Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Skyro"
      
      echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

  - name: Install Tailscale
    run: |
      # [จุดพัฒนา] ใช้ winget ติดตั้ง Tailscale ตัวล่าสุดอัตโนมัติ ไม่ต้องกลัวลิงก์เสีย
      winget install --id Tailscale.Tailscale --silent --accept-package-agreements --accept-source-agreements
      
      # Refresh Environment Paths เพื่อให้เรียกคำสั่ง tailscale ได้ทันที
      $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

  - name: Establish Tailscale Connection
    run: |
      $tailscalePath = "$env:ProgramFiles\Tailscale\tailscale.exe"
      
      # เชื่อมต่อ Tailscale ด้วย Auth Key และกำหนดชื่อ Hostname ไม่ให้ซ้ำกัน
      & $tailscalePath up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
      
      # วนลูปเช็ค IP จนกว่าจะได้
      $tsIP = $null
      $retries = 0
      while (-not $tsIP -and $retries -lt 15) {
          $tsIP = & $tailscalePath ip -4
          if (-not $tsIP) { Start-Sleep -Seconds 5 }
          $retries++
      }
      
      if (-not $tsIP) {
          Write-Error "Tailscale IP assignment timed out."
          exit 1
      }
      echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
  
  - name: Verify RDP Accessibility
    run: |
      Write-Host "Tailscale IP: $env:TAILSCALE_IP"
      $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
      if (-not $testResult.TcpTestSucceeded) {
          Write-Error "RDP port 3389 is not reachable."
          exit 1
      }
      Write-Host "RDP port test passed successfully!"

  - name: Maintain Connection
    run: |
      Write-Host "`n=========================================="
      Write-Host "          RDP CONNECTION READY           "
      Write-Host "=========================================="
      Write-Host "Address  : $env:TAILSCALE_IP"
      Write-Host "Username : Skyro"
      Write-Host "Password : $env:RDP_PASSWORD"
      Write-Host "==========================================`n"
      
      # แจ้งเตือนเรื่องเวลาจำกัดของ GitHub
      Write-Host "Note: This runner will automatically shut down after GitHub's time limit (max ~6 hours)."
      
      while ($true) {
          Write-Host "[$(Get-Date)] RDP session active..."
          Start-Sleep -Seconds 300
      }

